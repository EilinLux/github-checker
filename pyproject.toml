[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# This project uses uv for dependency management
# Install: https://docs.astral.sh/uv/getting-started/installation/
# Usage: uv sync

[project]
name = "github-checker"
version = "1.0.0"
description = "Comprehensive GitHub repository analyzer using GitHub App authentication"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zelda Ailine Luconi"},
]

dependencies = [
    "pygithub>=1.55",
    "pandas>=1.3.0",
    "xlsxwriter>=3.0.0",
    "python-dotenv>=0.19.0",
    "pyjwt>=2.4.0",
    "requests>=2.26.0",
    "cryptography>=3.4.0",
    "pyyaml>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "black>=21.6b0",
    "flake8>=3.9.0",
    "mypy>=0.910",
]

[project.urls]
Homepage = "https://github.com/yourusername/github-checker"
Documentation = "https://github.com/yourusername/github-checker#readme"
Repository = "https://github.com/yourusername/github-checker.git"
Issues = "https://github.com/yourusername/github-checker/issues"

[tool.setuptools]
packages = ["commons", "apps"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=commons --cov=apps"
